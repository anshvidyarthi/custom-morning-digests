name: Morning Digest

on:
  schedule:
    # GitHub Actions cron is best-effort and frequently delayed by 30-90+ min,
    # or skipped entirely under platform load. Fire multiple times and rely on
    # the idempotency guard in morning_digest.py to ensure exactly one digest
    # per day. Each slot below is Mon–Fri only.
    - cron: '0 13 * * 1-5'  # primary: 13:00 UTC = 9am EDT / 8am EST
    - cron: '0 15 * * 1-5'  # retry  : 15:00 UTC = 11am EDT / 10am EST
    - cron: '0 17 * * 1-5'  # retry  : 17:00 UTC = 1pm EDT  / 12pm EST
  workflow_dispatch:  # allow manual trigger from the Actions tab

# Allow this workflow to commit the new digest + ledger back to the repo.
permissions:
  contents: write

concurrency:
  group: morning-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ vars.DIGEST_TO || 'anshvidyarthi@gmail.com' }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL || 'claude-sonnet-4-5' }}
        run: python morning_digest.py

      # Upload the raw model output for post-mortem when the digest step fails
      # (usually a "validation caught too few items" case — we want to see what
      # the model actually produced so we can tell "structural mismatch" from
      # "genuine no-news day"). Kept 30 days.
      - name: Upload raw response on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-response-${{ github.run_id }}
          path: .last-raw-response.md
          if-no-files-found: warn
          retention-days: 30

      - name: Commit digest + ledger
        run: |
          git config user.name "morning-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digests/ .covered-urls.tsv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(TZ=America/New_York date +%Y-%m-%d)
            git commit -m "Digest for $DATE"
            git push
          fi
